# 平台配置文件
# 定义需要下载的操作系统平台
# 每行一个平台，格式: platform_tag
# 
# 常用平台标签:
#   Linux:
#     - manylinux2014_x86_64 (兼容性更好)
#     - manylinux_2_17_x86_64
#     - linux_x86_64
#   Windows:
#     - win_amd64 (64位)
#     - win32 (32位)
#   macOS:
#     - macosx_10_9_x86_64 (Intel)
#     - macosx_11_0_arm64 (Apple Silicon)
#
# 注释行以 # 开头，空行会被忽略

# Linux 64位
manylinux2014_x86_64

# Windows 64位
win_amd64

# Windows 32位 (可选，取消注释以启用)
# win32

# macOS Intel (可选，取消注释以启用)
# macosx_10_9_x86_64

# macOS Apple Silicon (可选，取消注释以启用)
# macosx_11_0_arm64

