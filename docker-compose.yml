# Docker Compose 配置文件
# 用于快速启动 PyPI 离线服务器
#
# 使用方法:
#   1. 首先运行下载脚本下载 Python 包:
#      ./download_packages.sh
#
#   2. 启动服务:
#      docker-compose up -d
#
#   3. 停止服务:
#      docker-compose down
#
#   4. 查看日志:
#      docker-compose logs -f
#

services:
  pypiserver:
    build:
      context: .
      dockerfile: Dockerfile.pypiserver
    image: offline-pypi:latest
    container_name: offline-pypi
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 将本地 packages 目录映射到容器内
      # 这样更新包时只需重新运行下载脚本，无需重建镜像
      - ./packages:/opt/pypi/packages:ro
    environment:
      # pypiserver 相关环境变量（如需要可自定义）
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
