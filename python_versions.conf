# Python 版本配置文件
# 定义需要支持的 Python 版本
# 每行一个版本号，格式: 主版本+次版本 (如 310 表示 3.10)
#
# 常用版本:
#   - 38  (Python 3.8)
#   - 39  (Python 3.9)
#   - 310 (Python 3.10)
#   - 311 (Python 3.11)
#   - 312 (Python 3.12)
#   - 313 (Python 3.13)
#
# 注释行以 # 开头，空行会被忽略

# Python 3.10 (默认启用)
310

# Python 3.11 (可选，取消注释以启用)
# 311

# Python 3.12 (可选，取消注释以启用)
# 312

# Python 3.9 (可选，取消注释以启用)
# 39

# Python 3.8 (可选，取消注释以启用)
# 38

