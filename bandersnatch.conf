[mirror]
directory = /opt/pypi
; bandersnatch 需要使用官方 PyPI 的 XML-RPC API，镜像源不支持此接口
master = https://pypi.org
json = false
workers = 3
timeout = 300
storage-backend = filesystem

; 使用白名单插件来只镜像指定的包
[plugins]
enabled =
    allowlist_project

; 白名单配置：只镜像 requirements.txt 中的包
[allowlist]
packages =
    h5py
    lxml
    matplotlib
    netcdf4
    numpy
    opencv-python
    pandas
    pillow
    pip
    requests
    scikit-learn
    scipy
    setuptools
    wheel
